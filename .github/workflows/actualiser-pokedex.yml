

name: Actualiser le Pokedex

# ==========================================
# POKEDEX ACETIQUE V6.2
# ACTUALISATION AUTOMATIQUE
# ==========================================

on:
  workflow_dispatch:

  schedule:
    # Tous les jours à 08:00 UTC
    # Québec : 04:00 été / 03:00 hiver
    - cron: "0 8 * * *"

# Autoriser les commits automatiques.
permissions:
  contents: write

# Éviter deux exécutions simultanées.
concurrency:
  group: actualiser-pokedex
  cancel-in-progress: false

jobs:

  actualiser:
    name: Vérifier les nouveaux Pokémon

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. RÉCUPÉRER LE DÉPÔT
      # ==========================================

      - name: Récupérer le dépôt GitHub
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      # ==========================================
      # 2. INSTALLER PYTHON
      # ==========================================

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ==========================================
      # 3. PRÉPARER LES DOSSIERS
      # ==========================================

      - name: Préparer les dossiers
        run: |
          mkdir -p data

          echo "=================================="
          echo "POKEDEX ACETIQUE V6.2"
          echo "INITIALISATION"
          echo "=================================="

          echo ""
          echo "Version Python :"
          python --version

          echo ""
          echo "Fichiers Python disponibles :"
          ls -lh *.py

      # ==========================================
      # 4. ACTUALISER LE CATALOGUE V5.8
      # ==========================================

      - name: Actualiser le catalogue Pokédex V5.8
        run: |
          echo "=================================="
          echo "POKEDEX V5.8"
          echo "ACTUALISATION DU CATALOGUE"
          echo "=================================="

          python -u update_pokedex.py

      # ==========================================
      # 5. TESTS AUTOMATIQUES V6.2
      # ==========================================

      - name: Tester le moteur de détection V6.2
        run: |
          echo "=================================="
          echo "POKEDEX ACETIQUE V6.2"
          echo "TESTS AUTOMATIQUES"
          echo "=================================="

          python -u detecter_nouveaux_pokemon.py --test

      # ==========================================
      # 6. DÉTECTION ANTICIPÉE V6.2
      # ==========================================

      - name: Détecter les nouveaux Pokémon V6.2
        run: |
          echo "=================================="
          echo "POKEDEX ACETIQUE V6.2"
          echo "DÉTECTION ANTICIPÉE PRO"
          echo "=================================="

          python -u detecter_nouveaux_pokemon.py

      # ==========================================
      # 7. ACTUALISER LES NOMS OFFICIELS
      # ==========================================

      - name: Actualiser les noms officiels FR EN
        run: |
          echo "=================================="
          echo "POKEDEX ACETIQUE"
          echo "NOMS OFFICIELS FR / EN"
          echo "=================================="

          python -u actualiser_noms_pokemon.py

      # ==========================================
      # 8. VÉRIFIER LES FICHIERS JSON
      # ==========================================

      - name: Vérifier les fichiers générés
        run: |
          echo "=================================="
          echo "VÉRIFICATION DES DONNÉES V6.2"
          echo "=================================="

          python - <<'PY'
          import json
          from pathlib import Path

          required_files = [
              "data/noms-pokemon-fr.json",
              "data/pokemon-a-verifier.json",
              "data/rapport-detection-v6.json",
              "data/annonces-non-reconnues.json",
              "data/catalogue-status.json",
              "data/sante-pokedex.json",
          ]

          errors = []

          for filename in required_files:
              path = Path(filename)

              if not path.is_file():
                  print(
                      f"ERREUR : fichier absent : {filename}"
                  )
                  errors.append(filename)
                  continue

              try:
                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as file:
                      json.load(file)

                  print(f"OK : {filename}")

              except (OSError, ValueError) as error:
                  print(
                      f"ERREUR : {filename} : {error}"
                  )
                  errors.append(filename)

          if errors:
              raise SystemExit(
                  "Vérification échouée : "
                  + ", ".join(errors)
              )

          print("")
          print("Tous les fichiers JSON sont valides.")
          PY

      # ==========================================
      # 9. AFFICHER LE RAPPORT V6.2
      # ==========================================

      - name: Afficher le rapport de détection V6.2
        run: |
          echo "=================================="
          echo "RAPPORT DE DÉTECTION V6.2"
          echo "=================================="

          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path(
              "data/rapport-detection-v6.json"
          )

          with report_path.open(
              "r",
              encoding="utf-8"
          ) as file:
              report = json.load(file)

          print(
              "Version :",
              report.get("version", "inconnue")
          )

          print(
              "Articles analysés :",
              report.get("articles_analyzed", 0)
          )

          print(
              "Articles exclus par contexte :",
              report.get(
                  "excluded_product_event_articles",
                  0
              )
          )

          print(
              "Correspondances détectées :",
              report.get("pattern_matches", 0)
          )

          print(
              "Espèces déjà connues exclues :",
              report.get(
                  "existing_species_matches",
                  0
              )
          )

          print(
              "Nouveaux candidats :",
              report.get("candidate_count", 0)
          )

          print(
              "En attente de vérification :",
              report.get("pending_review_count", 0)
          )

          print(
              "Validés manuellement :",
              report.get("validated_count", 0)
          )

          print(
              "Annonces non reconnues :",
              report.get(
                  "unrecognized_announcements",
                  0
              )
          )

          print("")
          print("SOURCES HISTORIQUES :")

          for name, stats in report.get(
              "sources", {}
          ).items():
              print(
                  f"- {name}: "
                  f"{stats.get('articles', 0)} articles"
              )

          print("")
          print(
              "FAUX POSITIFS HISTORIQUES ÉLIMINÉS :"
          )

          removed = report.get(
              "excluded_old_false_positives",
              []
          )

          if removed:
              for name in removed:
                  print(f"- {name}")
          else:
              print("Aucun nouveau retrait.")

          print("")
          print("==================================")
          print("FIN DU RAPPORT V6.2")
          print("==================================")
          PY

      # ==========================================
      # 10. AFFICHER LES CANDIDATS DÉTECTÉS
      # ==========================================

      - name: Afficher les nouveaux Pokémon potentiels
        run: |
          echo "=================================="
          echo "NOUVEAUX POKÉMON POTENTIELS"
          echo "=================================="

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/pokemon-a-verifier.json"
          )

          with path.open(
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          candidates = data.get(
              "candidates", []
          )

          print(
              "Nombre de candidats :",
              len(candidates)
          )

          if not candidates:
              print(
                  "Aucun nouveau Pokémon potentiel."
              )

          for candidate in candidates:
              print("")
              print(
                  "Nom :",
                  candidate.get("name", "")
              )
              print(
                  "Confiance :",
                  candidate.get("confidence", "")
              )
              print(
                  "Score :",
                  candidate.get("score", 0)
              )
              print(
                  "Statut :",
                  candidate.get("status", "")
              )
              print(
                  "Déjà provisoire :",
                  candidate.get(
                      "already_in_site_provisionally",
                      False
                  )
              )

              sources = candidate.get(
                  "sources", []
              )

              print(
                  "Nombre de sources :",
                  len(sources)
              )

              for source in sources[:5]:
                  print(
                      "-",
                      source.get("title", "")
                  )
                  print(
                      " ",
                      source.get("url", "")
                  )
          PY

      # ==========================================
      # 11. AFFICHER LES ANNONCES NON RECONNUES
      # ==========================================

      - name: Afficher les annonces à examiner
        run: |
          echo "=================================="
          echo "ANNONCES NON RECONNUES V6.2"
          echo "=================================="

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/annonces-non-reconnues.json"
          )

          with path.open(
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          announcements = data.get(
              "announcements", []
          )

          print(
              "Nombre total :",
              len(announcements)
          )

          print("")
          print("20 premières annonces :")

          for item in announcements[:20]:
              print("")
              print(
                  "-",
                  item.get("title", "")
              )
              print(
                  " ",
                  item.get("url", "")
              )
          PY

      # ==========================================
      # 12. ENREGISTRER SUR GITHUB
      # ==========================================

      - name: Enregistrer les modifications sur GitHub
        run: |
          echo "=================================="
          echo "ENREGISTREMENT SUR GITHUB"
          echo "=================================="

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Inclut :
          # - catalogue
          # - noms officiels
          # - candidats
          # - rapports
          # - annonces non reconnues
          git add index.html data/

          if git diff --cached --quiet; then

            echo ""
            echo "Aucune modification détectée."
            echo "Le Pokédex est déjà à jour."

          else

            echo ""
            echo "Modifications détectées."
            echo "Création du commit..."

            git commit -m \
              "Actualisation automatique Pokédex V6.2"

            echo ""
            echo "Envoi vers GitHub..."

            git push

            echo ""
            echo "Modifications enregistrées."

          fi

      # ==========================================
      # 13. RÉSUMÉ FINAL
      # ==========================================

      - name: Résumé final du Pokédex V6.2
        if: always()
        run: |
          echo "=================================="
          echo "POKEDEX ACETIQUE V6.2"
          echo "RÉSUMÉ FINAL"
          echo "=================================="

          echo ""
          echo "Version Python :"
          python --version

          echo ""
          echo "Fichiers du dossier data :"
          ls -lh data/ || true

          echo ""
          echo "État du dépôt Git :"
          git status --short

          echo ""
          echo "=================================="
          echo "FIN DE L'ACTUALISATION"
          echo "=================================="
