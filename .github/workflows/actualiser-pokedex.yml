
name: Actualiser le Pokedex

on:
  # Vérification quotidienne à 8 h au Québec (heure d'été)
  # ou 7 h en hiver
  schedule:
    - cron: "0 12 * * *"

  # Lancement manuel depuis GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualiser-pokedex
  cancel-in-progress: false

jobs:
  actualisation:
    name: Vérifier les nouveaux Pokémon
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # 1. Récupérer les fichiers GitHub
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # 2. Installer Python sans cache pip
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Créer le dossier data
      - name: Préparer le dossier data
        run: |
          mkdir -p data

      # 4. Vérifier les nouveautés dans PokéAPI
      - name: Actualiser les données Pokémon
        run: |
          python update_pokedex.py

      # 5. Détecter les fichiers modifiés
      - name: Vérifier les modifications
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Des modifications ont été détectées."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune modification détectée."
          fi

      # 6. Publier les modifications sur GitHub
      - name: Publier les modifications
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html data/

          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique du Pokédex"
            git push
            echo "Modifications publiées."
          else
            echo "Aucun fichier à publier."
          fi

      # 7. Confirmation
      - name: Résultat final
        run: |
          echo "======================================"
          echo "POKEDEX - ACTUALISATION TERMINEE"
          echo "======================================"
          echo "Vérification des nouveaux Pokémon terminée."
