
name: Actualiser le Pokedex

on:
  # Vérification automatique chaque jour à 8 h au Québec
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Toronto"

  # Permet de lancer manuellement
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualiser-pokedex
  cancel-in-progress: false

jobs:
  actualisation:
    name: Vérifier les nouveaux Pokémon
    runs-on: ubuntu-24.04

    timeout-minutes: 20

    steps:
      # 1. Télécharger les fichiers du dépôt
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # 2. Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      # 3. Installer les dépendances
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 4. Préparer le dossier de données
      - name: Préparer le dossier data
        run: |
          mkdir -p data

      # 5. Vérifier les nouveaux Pokémon
      - name: Actualiser les données Pokémon
        run: |
          python update_pokedex.py

      # 6. Vérifier si les données ont changé
      - name: Vérifier les modifications
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelles données détectées."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle donnée."
          fi

      # 7. Enregistrer les nouvelles données
      - name: Publier les modifications
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique du Pokédex"
            git push
          else
            echo "Aucune modification dans data/."
          fi

      # 8. Afficher le résultat
      - name: Résultat final
        run: |
          echo "================================="
          echo "POKEDEX - ACTUALISATION TERMINEE"
          echo "================================="
          echo "Vérification PokéAPI terminée."
          echo "Surveillance Web selon le script Python."
          echo "Données mises à jour si disponibles."
