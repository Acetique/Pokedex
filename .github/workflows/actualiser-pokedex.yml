
name: Actualiser le Pokedex

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualiser-pokedex
  cancel-in-progress: false

jobs:
  actualisation:
    name: Vérifier les nouveaux Pokémon
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Préparer le dossier data
        run: mkdir -p data

      - name: Actualiser les données Pokémon
        run: python update_pokedex.py

      - name: Vérifier les modifications
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier les modifications
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique du Pokédex"
            git push
          fi

      - name: Résultat final
        run: echo "Actualisation du Pokédex terminée."
