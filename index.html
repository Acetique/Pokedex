.new-art{font-size:65px;min-height:130px;display:grid;place-items:center}.detail .new-art{font-size:100px}</style></head><body><header><div class="head"><div><h1 id="title">🔴 Mon Pokédex</h1><p id="subtitle">Explore les Pokémon, leurs statistiques et leurs évolutions.</p></div><div class="lang"><button id="fr" type="button">🇫🇷 Français</button><button id="en" type="button">🇬🇧 English</button></div></div></header><main class="wrap"><section class="panel"><div class="filters"><input id="search" type="search" autocomplete="off" aria-label="Rechercher"><select id="generation" aria-label="Génération"></select><select id="type" aria-label="Type"></select><button class="favorite-toggle" id="favorites" type="button">★ Favoris</button></div><div class="toolbar"><span id="status" role="status"></span><span id="count"></span></div><div id="grid" class="grid"></div><button id="more" class="more" type="button" hidden></button></section><p id="foot" class="hint"></p></main><dialog id="dialog"><div id="detail" class="detail"></div></dialog><script>
'use strict';const API='https://pokeapi.co/api/v2',MAX=1025,PAGE=72;const $=id=>document.getElementById(id);const genRanges=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025],[1026,1028]];const newPokemon=[{id:1026,name:"browt",fr:"Broussatif",type:"grass",height:0.3,weight:3.5,ability:"Engrais",abilityEn:"Overgrow",emoji:"🌿🐤",url:"https://www.pokemon-france.com/pokedex/broussatif/"},{id:1027,name:"pombon",fr:"Caloulou",type:"fire",height:0.4,weight:6.7,ability:"Brasier",abilityEn:"Blaze",emoji:"🔥🐶",url:"https://www.pokepedia.fr/Caloulou"},{id:1028,name:"gecqua",fr:"Ogéko",type:"water",height:0.3,weight:4.3,ability:"Torrent",abilityEn:"Torrent",emoji:"💧🦎",url:"https://www.pokepedia.fr/Og%C3%A9ko"}];const typeNames={normal:'Normal',fire:'Feu',water:'Eau',electric:'Électrik',grass:'Plante',ice:'Glace',fighting:'Combat',poison:'Poison',ground:'Sol',flying:'Vol',psychic:'Psy',bug:'Insecte',rock:'Roche',ghost:'Spectre',dragon:'Dragon',dark:'Ténèbres',steel:'Acier',fairy:'Fée'};const colors={normal:'#8c929b',fire:'#e86a39',water:'#418bce',electric:'#d8a925',grass:'#54a666',ice:'#59b5bb',fighting:'#bc5848',poison:'#9864bd',ground:'#c49b56',flying:'#8b9dd0',psychic:'#dc6c99',bug:'#8da839',rock:'#a58d63',ghost:'#7765a6',dragon:'#5f70bb',dark:'#636471',steel:'#819ba9',fairy:'#d881b3'};const t={fr:{title:'🔴 Mon Pokédex',subtitle:'Explore les Pokémon, leurs statistiques et leurs évolutions.',search:'🔎 Nom français, anglais ou numéro',allGen:'Toutes les générations',gen:'Génération',allTypes:'Tous les types',favorites:'★ Favoris',found:'Pokémon trouvés',more:'Afficher plus',foot:'Données et illustrations : PokéAPI. Internet nécessaire pour charger les fiches.',loading:'Chargement des Pokémon…',error:'Impossible de charger les Pokémon. Vérifie ta connexion puis recharge la page.',none:'Aucun Pokémon trouvé.',height:'Taille',weight:'Poids',abilities:'Talents',stats:'Statistiques',evolution:'Évolutions',shiny:'✨ Chromatique',normal:'Image normale',close:'Fermer',detailError:'Impossible de charger la fiche.',loadingDetail:'Chargement de la fiche…'},en:{title:'🔴 My Pokédex',subtitle:'Explore Pokémon, their stats and evolutions.',search:'🔎 English/French name or number',allGen:'All generations',gen:'Generation',allTypes:'All types',favorites:'★ Favorites',found:'Pokémon found',more:'Show more',foot:'Data and artwork: PokéAPI. Internet is required to load entries.',loading:'Loading Pokémon…',error:'Could not load Pokémon. Check your connection and reload.',none:'No Pokémon found.',height:'Height',weight:'Weight',abilities:'Abilities',stats:'Stats',evolution:'Evolutions',shiny:'✨ Shiny',normal:'Normal artwork',close:'Close',detailError:'Unable to load details.',loadingDetail:'Loading details…'}};let lang=localStorage.getItem('dex-lang-v3')==='en'?'en':'fr';let favorites=new Set(JSON.parse(localStorage.getItem('dex-favs-v3')||'[]'));let all=[],filtered=[],shown=0,onlyFav=false,selected=null,shiny=false,requestId=0;const pokemonCache=new Map(),speciesCache=new Map(),frNames=new Map(),typeIds=new Map();const image=(id,shine=false)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${shine?'shiny/':''}${id}.png`;const idFromUrl=url=>Number(url.match(/\/(\d+)\/$/)?.[1]);const fetchJson=async url=>{const r=await fetch(url);if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()};function cached(map,key,url){if(!map.has(key))map.set(key,fetchJson(url).catch(e=>{map.delete(key);throw e}));return map.get(key)}const getPokemon=id=>cached(pokemonCache,id,`${API}/pokemon/${id}`);const getSpecies=id=>cached(speciesCache,id,`${API}/pokemon-species/${id}`);const nameOf=p=>p.id>MAX?(lang==='fr'?p.fr:p.name.charAt(0).toUpperCase()+p.name.slice(1)):lang==='fr'?(frNames.get(p.id)||p.name.replaceAll('-',' ')):p.name.replaceAll('-',' ');const typeLabel=type=>lang==='fr'?typeNames[type]:type.charAt(0).toUpperCase()+type.slice(1);function badge(type){const el=document.createElement('span');el.className='type';el.textContent=typeLabel(type);el.style.background=colors[type]||'#768295';return el}function saveFav(){localStorage.setItem('dex-favs-v3',JSON.stringify([...favorites]))}function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);saveFav();filter();if(selected?.id===id)renderDetail(selected)}function translate(){document.documentElement.lang=lang;const z=t[lang];$('title').textContent=z.title;$('subtitle').textContent=z.subtitle;$('search').placeholder=z.search;$('favorites').textContent=z.favorites;$('favorites').classList.toggle('active',onlyFav);$('more').textContent=z.more;$('foot').textContent=z.foot;const g=$('generation').value||'all',ty=$('type').value||'all';$('generation').replaceChildren(new Option(z.allGen,'all'),...genRanges.map((_,i)=>new Option(`${z.gen} ${i+1}`,String(i))));$('generation').value=g;$('type').replaceChildren(new Option(z.allTypes,'all'),...Object.keys(typeNames).map(k=>new Option(typeLabel(k),k)));$('type').value=ty;$('fr').classList.toggle('active',lang==='fr');$('en').classList.toggle('active',lang==='en');if(all.length)filter();if(selected)$('dialog').open&&renderDetail(selected)}function makeCard(p){const el=document.createElement('article');el.className='poke';const star=document.createElement('button');star.className='star'+(favorites.has(p.id)?' saved':'');star.textContent=favorites.has(p.id)?'★':'☆';star.setAttribute('aria-label','Favorite');star.onclick=()=>toggleFav(p.id);const main=document.createElement('button');main.className='main';main.innerHTML=`<div class="number">#${String(p.id).padStart(4,'0')}</div><img loading="lazy" alt="" src="${image(p.id)}"><div class="name"></div><div class="types"></div>`;if(p.id>MAX){const im=main.querySelector('img');im.remove();const art=document.createElement('div');art.className='new-art';art.textContent=p.emoji;art.setAttribute('aria-label',nameOf(p));main.querySelector('.number').after(art);main.querySelector('.number').textContent='GEN 10 · NEW';}main.querySelector('.name').textContent=nameOf(p);main.onclick=()=>openDetail(p);el.append(star,main);if(p.id>MAX){main.querySelector('.types').append(badge(p.type));return el;}getPokemon(p.id).then(d=>{if(!el.isConnected)return;const box=main.querySelector('.types');box.replaceChildren(...d.types.map(x=>badge(x.type.name)))}).catch(()=>{});return el}function render(reset=true){if(reset){shown=0;$('grid').replaceChildren()}const part=filtered.slice(shown,shown+PAGE);$('grid').append(...part.map(makeCard));shown+=part.length;$('more').hidden=shown>=filtered.length;$('status').textContent=filtered.length?`${filtered.length} ${t[lang].found}`:t[lang].none;$('count').textContent=`${shown} / ${filtered.length}`}function filter(){const q=$('search').value.trim().toLocaleLowerCase(),g=$('generation').value,ty=$('type').value;filtered=all.filter(p=>(!q||String(p.id)===q||p.name.includes(q)||nameOf(p).toLocaleLowerCase().includes(q)||(frNames.get(p.id)||'').toLocaleLowerCase().includes(q))&&(g==='all'||p.id>=genRanges[+g][0]&&p.id<=genRanges[+g][1])&&(ty==='all'||(p.id>MAX?p.type===ty:typeIds.get(ty)?.has(p.id)))&&(!onlyFav||favorites.has(p.id)));render()}function statLine(s){const row=document.createElement('div');row.className='stat';const label=document.createElement('span');label.textContent=s.stat.name.replace('special-attack','Sp. Atk').replace('special-defense','Sp. Def').replace('attack','Atk').replace('defense','Def').replace('speed','Speed').replace('hp','HP');const val=document.createElement('b');val.textContent=s.base_stat;const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=Math.min(100,s.base_stat/255*100)+'%';track.append(fill);row.append(label,val,track);return row}async function renderDetail(p){const token=++requestId;selected=p;const z=t[lang];$('detail').textContent=z.loadingDetail;try{if(p.id>MAX){const root=$('detail');root.replaceChildren();const h=document.createElement('h2');h.textContent=nameOf(p);const art=document.createElement('div');art.className='new-art';art.textContent=p.emoji;const info=document.createElement('p');info.textContent=`${typeLabel(p.type)} · ${p.height} m · ${p.weight} kg · ${lang==='fr'?p.ability:p.abilityEn}`;const note=document.createElement('p');note.textContent=lang==='fr'?'Pokémon de la 10e génération. Numéro national, statistiques, évolutions et forme chromatique non dévoilés.':'Generation 10 Pokémon. National number, stats, evolutions and shiny form not yet revealed.';const link=document.createElement('a');link.href=p.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=lang==='fr'?'Voir la fiche avec illustration officielle ↗':'View profile with official artwork ↗';root.append(h,art,info,note,link);return;}const [d,s]=await Promise.all([getPokemon(p.id),getSpecies(p.id)]);if(token!==requestId)return;const localized=s.names.find(x=>x.language.name==='fr')?.name;if(localized){frNames.set(p.id,localized)}const name=nameOf(p);const root=$('detail');root.replaceChildren();const top=document.createElement('div');top.className='detail-head';const num=document.createElement('span');num.className='number';num.textContent=`#${String(p.id).padStart(4,'0')}`;const close=document.createElement('button');close.className='close';close.textContent='✕';close.setAttribute('aria-label',z.close);close.onclick=()=>$('dialog').close();top.append(num,close);const hero=document.createElement('div');hero.className='hero';const pic=document.createElement('img');pic.src=image(p.id,shiny);pic.onerror=()=>{pic.src=image(p.id)};pic.alt=name;const heading=document.createElement('h2');heading.textContent=name;const tags=document.createElement('div');tags.className='types';tags.append(...d.types.map(x=>badge(x.type.name)));const info=document.createElement('p');info.className='info';info.textContent=`${z.height}: ${d.height/10} m   •   ${z.weight}: ${d.weight/10} kg`;const actions=document.createElement('div');actions.className='actions';const shine=document.createElement('button');shine.textContent=shiny?z.normal:z.shiny;shine.onclick=()=>{shiny=!shiny;pic.src=image(p.id,shiny);shine.textContent=shiny?z.normal:z.shiny};const fav=document.createElement('button');fav.textContent=favorites.has(p.id)?'★ '+z.favorites:'☆ '+z.favorites;fav.onclick=()=>toggleFav(p.id);actions.append(shine,fav);hero.append(pic,heading,tags,info,actions);root.append(top,hero);const abilities=document.createElement('section');abilities.className='section';const ah=document.createElement('h3');ah.textContent=z.abilities;const ap=document.createElement('p');ap.textContent=d.abilities.map(a=>a.ability.name.replaceAll('-',' ')).join(' · ');abilities.append(ah,ap);root.append(abilities);const stats=document.createElement('section');stats.className='section';const sh=document.createElement('h3');sh.textContent=z.stats;const rows=document.createElement('div');rows.className='stats';rows.append(...d.stats.map(statLine));stats.append(sh,rows);root.append(stats);const evoSection=document.createElement('section');evoSection.className='section';const eh=document.createElement('h3');eh.textContent=z.evolution;evoSection.append(eh);root.append(evoSection);if(s.evolution_chain?.url){fetchJson(s.evolution_chain.url).then(chain=>{if(token!==requestId)return;const entries=[];function walk(node){const id=idFromUrl(node.species.url);if(id&&id<=MAX)entries.push({id,name:node.species.name});node.evolves_to.forEach(walk)}walk(chain.chain);const holder=document.createElement('div');holder.className='evolutions';entries.forEach(e=>{const b=document.createElement('button');b.className='evo';const im=document.createElement('img');im.loading='lazy';im.src=image(e.id);const n=document.createElement('div');n.textContent=nameOf(e);b.append(im,n);b.onclick=()=>{shiny=false;renderDetail(e)};holder.append(b);getSpecies(e.id).then(es=>{const fr=es.names.find(x=>x.language.name==='fr')?.name;if(fr){frNames.set(e.id,fr);n.textContent=nameOf(e)}}).catch(()=>{})});evoSection.append(holder)}).catch(()=>{})}}catch(e){if(token===requestId)$('detail').textContent=z.detailError}}function openDetail(p){shiny=false;$('dialog').showModal();renderDetail(p)}async function init(){translate();$('status').textContent=t[lang].loading;try{const data=await fetchJson(`${API}/pokemon?limit=${MAX}`);all=data.results.map((p,i)=>({id:idFromUrl(p.url)||i+1,name:p.name})).filter(p=>p.id<=MAX).concat(newPokemon).sort((a,b)=>a.id-b.id);filter();loadFrenchNames()}catch(e){$('status').textContent=t[lang].error}}async function loadFrenchNames(){// Limited concurrency prevents flooding PokéAPI; results are progressively translated.
let next=1;async function worker(){while(next<=MAX){const id=next++;try{const s=await getSpecies(id);const n=s.names.find(x=>x.language.name==='fr')?.name;if(n)frNames.set(id,n);if(id%24===0&&lang==='fr'&&!$('search').value)refreshNames()}catch(e){}}}await Promise.all(Array.from({length:5},worker));if(lang==='fr')refreshNames()}function refreshNames(){for(const node of $('grid').children){const id=Number(node.querySelector('.number')?.textContent.slice(1));const p=all.find(x=>x.id===id);if(p)node.querySelector('.name').textContent=nameOf(p)}}$('search').oninput=filter;$('generation').onchange=filter;$('type').onchange=async()=>{const type=$('type').value;if(type!=='all'&&!typeIds.has(type)){const old=$('status').textContent;$('status').textContent=t[lang].loading;try{const d=await fetchJson(`${API}/type/${type}`);typeIds.set(type,new Set(d.pokemon.map(x=>idFromUrl(x.pokemon.url))))}catch(e){$('status').textContent=t[lang].error;return}}filter()};$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').classList.toggle('active',onlyFav);filter()};$('more').onclick=()=>render(false);$('fr').onclick=()=>{lang='fr';localStorage.setItem('dex-lang-v3',lang);translate()};$('en').onclick=()=>{lang='en';localStorage.setItem('dex-lang-v3',lang);translate()};$('dialog').addEventListener('close',()=>{requestId++;selected=null});init();if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>caches.keys()).then(keys=>Promise.all(keys.filter(k=>k.startsWith('pokedex-')).map(k=>caches.delete(k)))).catch(()=>{})}
