let next=1;async function worker(){while(next<=MAX){const id=next++;try{const s=await getSpecies(id);const n=s.names.find(x=>x.language.name==='fr')?.name;if(n)frNames.set(id,n);const category=s.genera?.find(x=>x.language.name==="fr")?.genus||s.genera?.find(x=>x.language.name==="en")?.genus;if(category)categoryMap.set(id,category);if(id%48===0)refreshCategories();if(id%24===0&&lang==='fr'&&!$('search').value)refreshNames()}catch(e){}}}await Promise.all(Array.from({length:5},worker));if(lang==='fr')refreshNames()}function refreshNames(){for(const node of $('grid').children){const id=Number(node.querySelector('.number')?.textContent.slice(1));const p=all.find(x=>x.id===id);if(p)node.querySelector('.name').textContent=nameOf(p)}}$('search').oninput=filter;$('generation').onchange=filter;$('type').onchange=async()=>{const type=$('type').value;if(type!=='all'&&!typeIds.has(type)){const old=$('status').textContent;$('status').textContent=t[lang].loading;try{const d=await fetchJson(`${API}/type/${type}`);typeIds.set(type,new Set(d.pokemon.map(x=>idFromUrl(x.pokemon.url))))}catch(e){$('status').textContent=t[lang].error;return}}filter()};$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').classList.toggle('active',onlyFav);filter()};$('more').onclick=()=>render(false);$('fr').onclick=()=>{lang='fr';localStorage.setItem('dex-lang-v3',lang);translate()};$('en').onclick=()=>{lang='en';localStorage.setItem('dex-lang-v3',lang);translate()};$('dialog').addEventListener('close',()=>{requestId++;selected=null;unlockPage()});init();if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).then(()=>caches.keys()).then(keys=>Promise.all(keys.filter(k=>k.startsWith('pokedex-')).map(k=>caches.delete(k)))).catch(()=>{})}

const competitiveFormats=[['gen9ou','9G — OU (solo)'],['gen9uu','9G — UU (solo)'],['gen9ubers','9G — Ubers'],['gen9nationaldex','9G — National Dex'],['gen9doublesou','9G — Doubles OU'],['gen8ou','8G — OU'],['gen7ou','7G — OU']];
const smogonCache=new Map();
function smogonKey(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function loadSmogon(format){if(!smogonCache.has(format)){smogonCache.set(format,fetch('https://pkmn.github.io/smogon/data/sets/'+format+'.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).catch(e=>{smogonCache.delete(format);throw e}))}return smogonCache.get(format)}
function setField(v){if(Array.isArray(v))return v.join(' / ');return v==null?'—':String(v)}
function setList(v){if(!v)return [];return Array.isArray(v)?v:[v]}
async function addCompetitive(root,p,d,s,token,detailLang){
 const fr=detailLang==='fr';const valid=()=>token===requestId&&lang===detailLang&&root.isConnected;

 if(!match){output.replaceChildren(element('p',fr?'Aucun ensemble Smogon publié pour ce Pokémon dans ce format.':'No published Smogon set for this Pokémon in this format.'));return}
 const sets=Object.entries(match[1]||{});output.replaceChildren();if(!sets.length){output.append(element('p',fr?'Aucun ensemble disponible.':'No set available.'));return}
 for(const [role,build] of sets.slice(0,8)){

 const lines=[[(fr?'Rôle':'Role'),role],[(fr?'Objet':'Item'),setField(build.item)],[(fr?'Talent':'Ability'),setField(build.ability)],[(fr?'Nature':'Nature'),setField(build.nature)],['EV',build.evs?Object.entries(build.evs).map(([k,v])=>k.toUpperCase()+' '+v).join(' · '):'—'],[(fr?'Type Téracristal':'Tera type'),setField(build.teraType)],[(fr?'Attaques':'Moves'),setList(build.moves).map(setField).join(' · ')||'—']];
 for(const [key,value] of lines){const line=element('p','');const b=element('strong',key+' : ');const content=document.createTextNode(fr?'Traduction en cours…':value);line.append(b,content);card.append(line);if(fr&&key!=='EV')localizedSetValue(key==='Attaques'?setList(build.moves).map(setField):value,true).then(v=>{if(valid()&&seq===run)content.textContent=v});else if(fr)content.textContent=value}
 const note=element('p',fr?'Les noms anglais sont traduits en français lorsque possible; les traductions automatiques peuvent être imprécises.':'Names are displayed in English.');note.className='extra-note';card.append(note);output.append(card)
 }
 const link=document.createElement('a');link.href='https://www.smogon.com/dex/sv/pokemon/'+encodeURIComponent(p.name)+'/';link.target='_blank';link.rel='noopener noreferrer';link.textContent=fr?'Consulter les analyses stratégiques Smogon ↗':'Read Smogon strategy analyses ↗';output.append(link);
 }catch(e){if(valid()&&seq===run)output.replaceChildren(element('p',fr?'Données compétitives temporairement indisponibles.':'Competitive data temporarily unavailable.'))}}
 select.onchange=renderSets;renderSets();

}
