<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e53935"><link rel="manifest" href="manifest.webmanifest"><title>Pokédex FR / EN — Version 2</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f5fa;color:#1e293b}header{background:#e53935;color:white;padding:24px;text-align:center}h1{margin:0;font-size:32px}.wrap{max-width:1250px;margin:auto;padding:22px}.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}input,select{padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;flex:1;min-width:170px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:16px}.pokemon{background:white;border-radius:16px;padding:12px;text-align:center;box-shadow:0 3px 12px #0001;cursor:pointer;border:2px solid transparent}.pokemon:hover{border-color:#ef5350;transform:translateY(-2px)}.pokemon img{width:130px;height:130px;object-fit:contain}.num{color:#64748b;font-size:13px}.name{font-weight:750;font-size:18px;text-transform:capitalize}.types{font-size:13px;color:#475569;margin-top:6px}.status{text-align:center;margin:16px}button{padding:12px 18px;border:0;border-radius:12px;background:#e53935;color:white;cursor:pointer;font-size:15px}dialog{border:0;border-radius:20px;max-width:400px;width:90%;text-align:center;box-shadow:0 12px 50px #0005}dialog img{width:200px;height:200px;object-fit:contain}dialog::backdrop{background:#0009}.small{font-size:13px;color:#64748b}#more{display:block;margin:22px auto}#more[hidden]{display:none}</style></head><body><header><h1 id="heading">🔴 Mon Pokédex</h1><div id="subtitle">Explore tous les Pokémon et leurs photos !</div><div style="margin-top:12px"><button id="frBtn" type="button" aria-label="Français">🇫🇷 Français</button> <button id="enBtn" type="button" aria-label="English">🇬🇧 English</button></div></header><main class="wrap"><div class="tools"><input id="search" placeholder="🔎 Nom ou numéro du Pokémon"><select id="generation"><option value="all">Toutes les générations</option></select><select id="type"><option value="all">Tous les types</option></select></div><div id="status" class="status">Chargement des Pokémon…</div><div id="grid" class="grid"></div><button id="more" hidden>Afficher plus</button><p class="small" id="attribution">Les informations et images proviennent de PokéAPI. Une connexion Internet est nécessaire au premier chargement.</p></main><dialog id="details"><button id="close" style="float:right">✕</button><div id="detailContent"></div></dialog><script>
let lang=localStorage.getItem('pokedex-lang')==='en'?'en':'fr';const API='https://pokeapi.co/api/v2', cache=new Map(), names=new Map();let all=[],filtered=[],shown=0;const perPage=72;const $=id=>document.getElementById(id);const gens=[[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];const types=['normal','fire','water','electric','grass','ice','fighting','poison','ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];const french={normal:'Normal',fire:'Feu',water:'Eau',electric:'Électrik',grass:'Plante',ice:'Glace',fighting:'Combat',poison:'Poison',ground:'Sol',flying:'Vol',psychic:'Psy',bug:'Insecte',rock:'Roche',ghost:'Spectre',dragon:'Dragon',dark:'Ténèbres',steel:'Acier',fairy:'Fée'};const img=id=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;async function get(id){if(!cache.has(id))cache.set(id,fetch(`${API}/pokemon/${id}`).then(r=>{if(!r.ok)throw Error('Pokémon indisponible');return r.json()}));return cache.get(id)}function label(p){return (lang==='fr'?names.get(p.id):null)||p.name.replaceAll('-',' ')}function card(p){let el=document.createElement('article');el.className='pokemon';el.innerHTML=`<div class="num">#${String(p.id).padStart(4,'0')}</div><img loading="lazy" alt="" src="${img(p.id)}"><div class="name"></div><div class="types"></div>`;el.querySelector('.name').textContent=label(p);el.onclick=()=>openDetail(p);return el}function render(reset=true){if(reset){shown=0;$('grid').replaceChildren()}let part=filtered.slice(shown,shown+perPage);$('grid').append(...part.map(card));shown+=part.length;$('more').hidden=shown>=filtered.length;$('status').textContent=lang==='fr'?`${filtered.length} Pokémon trouvés`:`${filtered.length} Pokémon found`;for(let p of part)get(p.id).then(data=>{let node=[...$('grid').children].find(n=>n.querySelector('.num')?.textContent==='#'+String(p.id).padStart(4,'0'));if(node)node.querySelector('.types').textContent=data.types.map(t=>(lang==='fr'?french[t.type.name]:null)||t.type.name).join(' · ')}).catch(()=>{})}function filter(){let q=$('search').value.trim().toLowerCase(),g=$('generation').value,t=$('type').value;filtered=all.filter(p=>(!q||String(p.id)===q||label(p).toLowerCase().includes(q)||p.name.includes(q)|| (names.get(p.id)||'').toLowerCase().includes(q))&&(g==='all'||(p.id>=gens[+g][0]&&p.id<=gens[+g][1]))&&(t==='all'||typeIds[t]?.has(p.id)));render()}let typeIds={};async function openDetail(p){$('details').showModal();$('detailContent').textContent=lang==='fr'?'Chargement…':'Loading…';try{let d=await get(p.id);$('detailContent').replaceChildren();let pic=document.createElement('img');pic.src=img(p.id);pic.alt=label(p);let h=document.createElement('h2');h.textContent=`#${p.id} ${label(p)}`;let info=document.createElement('p');info.textContent=`${lang==='fr'?'Types':'Types'} : ${d.types.map(x=>(lang==='fr'?french[x.type.name]:null)||x.type.name).join(', ')} | ${lang==='fr'?'Taille':'Height'} : ${d.height/10} m | ${lang==='fr'?'Poids':'Weight'} : ${d.weight/10} kg`;$('detailContent').append(pic,h,info)}catch(e){$('detailContent').textContent=lang==='fr'?'Impossible de charger la fiche.':'Unable to load details.'}}$('close').onclick=()=>$('details').close();$('more').onclick=()=>render(false);$('search').oninput=filter;$('generation').onchange=filter;$('type').onchange=async()=>{let t=$('type').value;if(t!=='all'&&!typeIds[t]){let d=await fetch(`${API}/type/${t}`).then(r=>r.json());typeIds[t]=new Set(d.pokemon.map(x=>Number(x.pokemon.url.match(/\/(\d+)\/$/)?.[1])))}filter()};async function init(){gens.forEach((g,i)=>$('generation').add(new Option(`${lang==='fr'?'Génération':'Generation'} ${i+1}`,i)));types.forEach(t=>$('type').add(new Option(lang==='fr'?french[t]:t,t)));try{let list=await fetch(`${API}/pokemon?limit=1025`).then(r=>r.json());all=list.results.map((p,i)=>({id:Number(p.url.match(/\/(\d+)\/$/)?.[1])||i+1,name:p.name})).sort((a,b)=>a.id-b.id);filtered=all;render();fetch(`${API}/pokemon-species?limit=1025`).then(r=>r.json()).then(async d=>{let species=d.results;await Promise.all(Array.from({length:12},(_,k)=>Promise.all(species.slice(k*90,(k+1)*90).map(async s=>{try{let id=Number(s.url.match(/\/(\d+)\/$/)?.[1]);let data=await fetch(s.url).then(r=>r.json());let fr=data.names.find(x=>x.language.name==='fr');if(fr)names.set(id,fr.name)}catch{}}))));filter()}).catch(()=>{})}catch(e){$('status').textContent=lang==='fr'?'Connexion impossible. Vérifie ta connexion Internet puis recharge la page.':'Connection failed. Check your Internet connection and reload.'}}
function translateUI(){document.documentElement.lang=lang;$('heading').textContent=lang==='fr'?'🔴 Mon Pokédex':'🔴 My Pokédex';$('subtitle').textContent=lang==='fr'?'Explore tous les Pokémon et leurs photos !':'Explore every Pokémon and their pictures!';$('search').placeholder=lang==='fr'?'🔎 Nom ou numéro du Pokémon':'🔎 Pokémon name or number';$('generation').options[0].textContent=lang==='fr'?'Toutes les générations':'All generations';for(let i=1;i<$('generation').options.length;i++)$('generation').options[i].textContent=`${lang==='fr'?'Génération':'Generation'} ${i}`;$('type').options[0].textContent=lang==='fr'?'Tous les types':'All types';for(let i=1;i<$('type').options.length;i++){let o=$('type').options[i];o.textContent=lang==='fr'?french[o.value]:o.value.charAt(0).toUpperCase()+o.value.slice(1)}$('more').textContent=lang==='fr'?'Afficher plus':'Show more';$('attribution').textContent=lang==='fr'?'Les informations et images proviennent de PokéAPI. Une connexion Internet est nécessaire.':'Information and images are provided by PokéAPI. An Internet connection is required.';$('frBtn').style.outline=lang==='fr'?'2px solid white':'none';$('enBtn').style.outline=lang==='en'?'2px solid white':'none';if(all.length)filter()}
$('frBtn').onclick=()=>{lang='fr';localStorage.setItem('pokedex-lang',lang);translateUI()};$('enBtn').onclick=()=>{lang='en';localStorage.setItem('pokedex-lang',lang);translateUI()};translateUI();
init();if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.unregister()))).then(()=>caches.keys()).then(keys=>Promise.all(keys.filter(k=>k.startsWith('pokedex-')).map(k=>caches.delete(k)))).catch(()=>{});}
</script></body></html>
